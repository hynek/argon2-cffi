---
version: 2

build:
  os: ubuntu-lts-latest
  tools:
    # mandatory field; we let uv install Python to avoid manual duplication
    python: latest
  jobs:
    create_environment:
      # Need the tags to calculate the version (sometimes).
      - git fetch --tags

      - asdf plugin add uv
      - asdf install uv latest
      - asdf global uv latest

    build:
      html:
        - uv run --locked --only-group tox tox run -e docs-build -- $READTHEDOCS_OUTPUT
